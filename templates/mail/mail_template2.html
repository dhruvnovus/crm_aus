<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ subject|capfirst }}</title>

<style>
  /* RESET */
  html,body{margin:0;padding:0;background:#f3f4f6;} /* Light background */
  table{border-collapse:collapse;}
  img{border:0;display:block;max-width:100%;height:auto;}
  a{text-decoration:none;color:inherit;}

  /* Center wrapper */
  .email-wrap{
    width:100%;
    background:#f3f4f6; /* Soft grey instead of black */
    padding:26px 12px;
  }

  .email-container{
    max-width:640px;
    margin:0 auto;
    background:#ffffff;  /* White card */
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.08);
  }

  /* HERO */
  .hero{
    background:linear-gradient(135deg,#5b21b6 0%, #1e3a8a 40%, #0ea5a4 100%);
    padding:30px 32px;
    text-align:center;
    color:#fff;
  }

  .title{font-size:28px;font-family:Segoe UI,Arial,sans-serif;font-weight:700;margin:10px 0 6px;}
  .subtitle{font-size:15px;opacity:0.95;}

  /* Body */
  .body-card{
    padding:32px;
  }

  .lead{font-size:16px;font-family:Segoe UI,Arial,sans-serif;margin:0 0 18px;color:#0b1220;}

  /* CTA button */
  .btn{
    display:inline-block;
    background:linear-gradient(180deg,#ffd166,#ff8c00);
    padding:13px 28px;
    border-radius:12px;
    font-weight:700;
    color:#08101a;
    box-shadow:0 10px 30px rgba(255,140,0,0.18);
  }

  .footer{
    text-align:center;
    padding:20px 12px;
    font-size:13px;
    color:#6b7280;
  }

  /* MOBILE */
  @media (max-width:620px){
    .hero{padding:28px 20px;}
    .body-card{padding:22px;}
    .title{font-size:22px;}
    .btn{width:100%;display:block;text-align:center;}
  }
</style>

</head>
<body>
  <center class="email-wrap">
    <table class="email-container" width="100%">
      <!-- HERO IMAGE -->
      <tr>
        <td align="center" style="padding:20px;">
          <img src="https://wpstaq-ap-southeast-2-media.s3.amazonaws.com/disabilityexpos/wp-content/uploads/media/2025/10/DEA-Connecting-Communities.jpg"
               width="140" style="border-radius:10px;">
        </td>
      </tr>

      <!-- HERO SECTION -->
      <tr>
        <td class="hero">
          <div class="title">{{ subject|capfirst }}</div>
          <div class="subtitle">A message from Disability Expos Australia</div>
        </td>
      </tr>

      <!-- BODY -->
      <tr>
        <td class="body-card">
          <p class="lead">Dear {{ receiver_name|capfirst }},</p>

          <div style="font-family:Segoe UI,Arial,sans-serif;font-size:16px;line-height:24px;color:#0b1220;">
            {{body_html|safe}}
          </div>

          <div style="text-align:center;margin-top:40px;">
            <a href="#" class="btn" target="_blank">View Details</a>
          </div>

          <p style="font-size:13px;color:#6b7280;margin-top:18px;text-align:center;">
            If the button doesn't work, copy this link:<br>
            <a href="#" style="color:#0ea5a4;">#</a>
          </p>
        </td>
      </tr>

      <!-- FOOTER -->
      <tr>
        <td class="footer">
          © 2025 Disability Expos Australia<br>
          You received this email because you signed up for updates.
        </td>
      </tr>

    </table>
  </center>
</body>
</html>
